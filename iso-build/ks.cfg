#version=RHEL9
# Kickstart for a fully unattended Rocky Linux 9 install that ends with a
# running ACME/GlobalProtect appliance -- no manual steps after boot.

text
reboot

lang en_US.UTF-8
keyboard us
timezone America/Chicago --utc

network --bootproto=dhcp --device=link --activate
network --hostname=acme-appliance.local

rootpw --lock
# Uncomment and replace with a real password hash (openssl passwd -6) if
# you need console/root password login instead of key-only access:
# rootpw --iscrypted $6$replace-with-a-real-hash

zerombr
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr

selinux --enforcing
firewall --enabled --service=ssh

%packages --ignoremissing
@core
epel-release
python3
python3-pip
python3-venv
certbot
openssl
policycoreutils-python-utils
-firewalld-config-server
%end

%post --log=/root/ks-post.log
set -x

BAKED_SRC="/run/install/repo/acme-appliance-src"
DEST="/root/acme-appliance-src"

if [ -d "$BAKED_SRC" ]; then
  cp -r "$BAKED_SRC" "$DEST"
else
  echo "WARNING: no baked-in appliance source found at $BAKED_SRC." \
       "You will need to copy the appliance source to the box and run" \
       "iso-build/bootstrap-appliance.sh manually after first boot." \
       > /root/BOOTSTRAP_NOT_RUN.txt
fi

if [ -d "$DEST" ]; then
  chmod +x "$DEST/iso-build/bootstrap-appliance.sh"
  "$DEST/iso-build/bootstrap-appliance.sh" "$DEST" 2>&1 | tee -a /root/ks-post.log
fi
%end
