#version=RHEL9
# Kickstart for a fully unattended Rocky Linux 9 install that ends with a
# running ACME/GlobalProtect appliance -- no manual steps after boot.

text
reboot

lang en_US.UTF-8
keyboard us
timezone America/Chicago --utc

network --bootproto=dhcp --device=link --activate
network --hostname=acme-appliance.local

rootpw --lock
# rootpw --iscrypted $6$replace-with-a-real-hash

zerombr
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr

selinux --enforcing
firewall --enabled --service=ssh

# NOTE: "python3-venv" is deliberately NOT listed here -- Rocky/RHEL
# does not ship it as a separate package (venv ships inside base
# python3). Listing a nonexistent package name here fails the WHOLE
# %packages transaction, silently preventing everything else (including
# certbot) from installing.
#
# NOTE: "policycoreutils-python-utils" and "dnf-utils" are ALSO
# deliberately NOT listed here, for the same reason: this transaction is
# all-or-nothing, and policycoreutils-python-utils has been observed to
# have an unsatisfiable dependency on some systems/mirrors (a repo
# metadata mismatch reporting "nothing provides policycoreutils = X.Y-Z"
# for the exact version its own python3-policycoreutils dependency
# requires). Neither package is actually required for this appliance to
# function -- see the detailed comment in bootstrap-appliance.sh, which
# installs both as best-effort EXTRAS (each in its own transaction, with
# a warning logged rather than the whole run aborting) after this
# kickstart's %post section hands off to it below.
%packages --ignoremissing
@core
epel-release
python3
python3-pip
certbot
openssl
-firewalld-config-server
%end

%post --log=/root/ks-post.log
set -x

BAKED_SRC="/run/install/repo/acme-appliance-src"
DEST="/root/acme-appliance-src"

if [ -d "$BAKED_SRC" ]; then
  cp -r "$BAKED_SRC" "$DEST"
else
  echo "WARNING: no baked-in appliance source found at $BAKED_SRC." \
       "You will need to copy the appliance source to the box and run" \
       "iso-build/bootstrap-appliance.sh manually after first boot." \
       > /root/BOOTSTRAP_NOT_RUN.txt
fi

if [ -d "$DEST" ]; then
  chmod +x "$DEST/iso-build/bootstrap-appliance.sh"
  "$DEST/iso-build/bootstrap-appliance.sh" "$DEST" 2>&1 | tee -a /root/ks-post.log
fi
%end
